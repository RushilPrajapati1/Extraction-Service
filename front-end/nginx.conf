# Front door for the whole stack. Static UI at /, API at /api/, webhook
# service at /webhooks/. Service names resolve on the compose network;
# nothing but this container is published on the VM.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDFs can be large; FastAPI's default is fine but nginx's 1m is not.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /webhooks/ {
        proxy_pass http://webhook:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
